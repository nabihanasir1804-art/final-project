
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>☀ Weather App</h1>
            <p>Check the current weather of any city</p>
        </header>

        <form id="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit" id="search-btn">Search</button>
        </form>

        <p id="message" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="weather-card" hidden>
            <h2 id="city-name">City Name</h2>
            <p id="country"></p>

            <img id="weather-icon" src="" alt="Weather icon">

            <h2 id="temperature">--°C</h2>
            <p id="description">Weather description</p>

            <div class="details">
                <div class="detail">
                    <span>Feels Like</span>
                    <strong id="feels-like">--°C</strong>
                </div>

                <div class="detail">
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>Wind Speed</span>
                    <strong id="wind-speed">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>Pressure</span>
                    <strong id="pressure">-- hPa</strong>
                </div>
            </div>

            <button type="button" id="unit-btn">
                Switch to Fahrenheit (°F)
            </button>
        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>
    </div>

</body>
</html>
